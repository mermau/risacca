# Compila RISACCA su un Mac di GitHub (Apple Silicon) e pubblica VST3 + AU + Standalone.
# Avvio: a ogni push sul ramo main, oppure a mano da "Actions" > "Build macOS" > "Run workflow".
name: Build macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest          # runner arm64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v4

      - name: Configura (binario universale arm64 + x86_64)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DRISACCA_BUILD_TESTS=OFF

      - name: Compila
        run: |
          cmake --build build --config Release \
            --target Risacca_VST3 Risacca_AU Risacca_Standalone -- -quiet

      - name: Firma ad-hoc e impacchetta
        run: |
          OUT=build/Risacca_artefacts/Release
          mkdir -p dist
          for b in "$OUT/VST3/RISACCA.vst3" \
                   "$OUT/AU/RISACCA.component" \
                   "$OUT/Standalone/RISACCA.app"; do
            codesign --force --deep --sign - "$b"
            cp -R "$b" dist/
          done
          lipo -info "$OUT/VST3/RISACCA.vst3/Contents/MacOS/RISACCA"
          # senza questa voce macOS passa solo silenzio all'ingresso della Standalone
          plutil -p "$OUT/Standalone/RISACCA.app/Contents/Info.plist" | grep -E "NSMicrophoneUsageDescription|CFBundleIconFile"
          plutil -p "$OUT/Standalone/RISACCA.app/Contents/Info.plist" | grep -q NSMicrophoneUsageDescription
          cp docs/RISACCA-Manuale-d-uso.pdf dist/ 2>/dev/null || true
          cd dist && ditto -c -k --keepParent . ../RISACCA-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RISACCA-macOS
          path: RISACCA-macOS.zip

      - name: Validazione con pluginval (VST3 e AU) e auval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          mkdir -p ~/Library/Audio/Plug-Ins/VST3 ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/RISACCA.vst3" ~/Library/Audio/Plug-Ins/VST3/
          cp -R "dist/RISACCA.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          $PV --strictness-level 7 --validate-in-process --skip-gui-tests --timeout-ms 600000 \
              --validate ~/Library/Audio/Plug-Ins/VST3/"RISACCA.vst3"
          auval -v aumf Rsca Mmin
          $PV --strictness-level 7 --validate-in-process --skip-gui-tests --timeout-ms 600000 \
              --validate ~/Library/Audio/Plug-Ins/Components/"RISACCA.component"
